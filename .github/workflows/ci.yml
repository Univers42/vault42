name: vault42-ci

on:
  push:
    branches: [main, develop]
  pull_request:

# One commit produced two identical push runs, which queued two deploys of the same image
# behind the same lock. Collapsing superseded runs also means a rapid sequence of pushes
# deploys the last one rather than each in turn. A cancelled run reports conclusion
# `cancelled`, and the deploy job requires `success`, so cancelling here can never release
# something CI did not finish checking.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mirrors grobase's strictness: fmt clean, clippy warnings-as-errors, tests green, the gate
# battery green under --strict, supply-chain (audit + deny) clean, no committed secrets.
# buf (P1) and semgrep (P8) are added with the phases that introduce protobuf and the SSH
# surface.
jobs:
  rust:
    runs-on: ubuntu-latest
    container: public.ecr.aws/docker/library/rust:1.96-slim-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The gate battery is the only end-to-end coverage in the repo: it stands services up in
  # containers and drives them. Until now it ran only on a developer's machine, so nothing
  # stopped a merge that broke it. --strict turns a skipped gate into a failure, because a
  # missing toolchain image would otherwise let this job pass having run nothing at all.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_TOOLCHAIN_IMG: public.ecr.aws/docker/library/rust:1.96-slim-bookworm
    steps:
      - uses: actions/checkout@v4
      # Pulled explicitly rather than left to the gates: they check for the image and skip
      # when it is absent, and a skip must not be how this job succeeds.
      #
      # Retried because the registry rate-limits. One run failed on `toomanyrequests: Rate
      # exceeded` with nothing wrong in the tree, and a red gate battery that means "the mirror
      # was busy" teaches everyone to ignore a red gate battery.
      - name: pull the toolchain image (retried; the registry rate-limits)
        run: |
          for attempt in 1 2 3 4 5; do
            docker pull "$RUST_TOOLCHAIN_IMG" && exit 0
            printf 'pull attempt %s failed; backing off\n' "$attempt"
            sleep $((attempt * 15))
          done
          printf 'could not pull %s after 5 attempts\n' "$RUST_TOOLCHAIN_IMG"
          exit 1
      - run: sh scripts/verify/run-gate-battery.sh --all --strict

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run the OSS gitleaks BINARY (MIT), not gitleaks-action — the action
      # paywalls organization repos. Download is checksum-verified before use.
      - name: gitleaks (secret scan)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/$asset" -o "$asset"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " $asset\$" checksums.txt | sha256sum -c -
          tar xzf "$asset" gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1 --config .gitleaks.toml
