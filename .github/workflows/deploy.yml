name: deploy

# Deploys both fly.io apps when a release tag is pushed — which auto-release.yml does for every
# commit vault42-ci passes on develop — and only once it has re-checked that CI passed on that
# commit. The gate battery is the repo's only end-to-end coverage, so a deploy that did not wait
# for it would put an unverified binary in front of the vault.
#
# WHAT RUNS IN PRODUCTION IS A VERSION. It used to be "whatever develop was when CI last went
# green", recorded nowhere. Each image is labelled with its release (registry.fly.io/<app>:vX.Y.Z,
# shown by `fly status` and `42ctl cloud status`), the authority binary carries the version and
# commit it answers on /version, and the smoke test refuses a deploy whose authority does not
# report the release that was just shipped.
#
# COST. Both apps scale to zero, so the standing bill is two 1 GB volumes and nothing else.
# A deploy costs the runner's build time (free on a public repo) plus the seconds each machine
# is awake for the smoke test. Builds run on the GitHub runner with --local-only rather than a
# fly remote builder, because a remote builder is itself a billed fly machine. --ha=false
# creates ONE machine per app; fly's default is two, which would double the compute bill for
# an app that serves one operator.
#
# EVERY RUN REBUILDS BOTH IMAGES, INCLUDING FOR A DOCUMENTATION COMMIT, AND THAT IS
# DELIBERATE. Skipping the build when the commit touched no code was tried and reverted: it is
# unsound in combination with the CI concurrency group two files away. Collapsing superseded CI
# runs means an intermediate commit never gets its own deploy, so a code change can land in a
# run that is cancelled, and the next commit — a documentation one — would then look like it
# changed nothing and skip. The code would never be deployed and production would silently run
# the old binary, reported as a green deploy. Deciding this correctly needs the diff against
# what is actually DEPLOYED, which nothing here records. Actions minutes are free on a public
# repository; a vault silently running old code is not.
#
# ORDER IS LOAD-BEARING. The authority is deployed first because the server's
# VAULT42_CONTRACT_PUBKEY is the authority's public key: deploying the server first would pin
# it to a key the authority has not yet minted, and every request would be rejected by a
# server that looks perfectly healthy.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      target:
        description: "which app to deploy"
        type: choice
        options: [both, authority, server]
        default: both

# Two deploys racing would interleave `secrets import` with `deploy` and could pin the server
# to a key from a different run. Never cancel in flight: a half-finished deploy is worse than
# a queued one.
# Shared with the scenario workflow, which drives the same two machines and stops them
# mid-run. Different groups would let a deploy's release race the scenario's stop, and the
# loser leaves the apps in whichever state it finished in. Never cancel in flight: a
# half-finished deploy is worse than a queued one.
concurrency:
  group: fly-apps
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  # Pinned rather than :latest — this container is handed a token that can create and destroy
  # every machine in the org. sha256:39a83e2c4129b896df502d72027dde6e436b5cf8f74b994b144857e0e22c0d7b
  FLYCTL: flyio/flyctl:v0.4.101
  AUTHORITY_URL: https://vault42-authority.fly.dev
  SERVER_URL: https://vault42-server.fly.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A tag push can only come from somebody with write access (a fork cannot push a tag here),
    # so the pwn-request guard the workflow_run trigger needed has nothing left to guard. What CI
    # did is checked explicitly below instead of being implied by the trigger.
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      TARGET: ${{ inputs.target || 'both' }}
    steps:
      # Depth 2, because a release commit is checked through its parent below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # A release commit only changes version numbers, so the CI run that counts is its parent's —
      # the green commit auto-release.yml released. A tag somebody pushed by hand on a commit CI
      # never passed is refused here rather than deployed.
      - name: deploy only what vault42-ci passed
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          candidates=$(git rev-parse HEAD)
          case "$(git log -1 --format=%s)" in
            "release: v"*) candidates="$candidates $(git rev-parse HEAD^)" ;;
          esac
          for sha in $candidates; do
            passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&event=push&status=success" --jq '.total_count')
            if [ "$passed" -gt 0 ]; then
              printf 'vault42-ci passed on %s\n' "$sha"
              exit 0
            fi
          done
          printf 'refusing: no successful vault42-ci push run for %s\n' "$candidates"
          exit 1

      # The label is the tag when this is one, so `fly status` names the release; a manual deploy
      # of anything else is labelled with its commit too, so it can never pass for a release.
      - name: record what is being deployed
        run: |
          set -eu
          version=$(sh scripts/ops/release-version.sh current)
          commit=$(git rev-parse HEAD)
          if [ "$GITHUB_REF" = "refs/tags/v${version}" ]; then
            label="v${version}"
          else
            label="v${version}-g$(git rev-parse --short=7 HEAD)"
          fi
          printf 'commit: %s\nversion: %s\nlabel: %s\ntarget: %s\n' "$commit" "$version" "$label" "$TARGET"
          {
            echo "VAULT42_VERSION=${version}"
            echo "VAULT42_COMMIT=${commit}"
            echo "IMAGE_LABEL=${label}"
          } >> "$GITHUB_ENV"

      # The authority's own secrets, staged from this repository's before the release that
      # applies them. Without this the deploy is NOT reproducible: an app recreated from
      # scratch comes up with no mail transport and no invite gate, reports itself perfectly
      # healthy, and the whole degradation is one word in one startup log line. That happened.
      #
      # --stage rather than set, so the deploy immediately after applies them in the same
      # release and the machine restarts once instead of twice. The values go in over stdin
      # from a file, never in an argument list, and the file dies with the runner.
      - name: stage the authority's secrets
        if: ${{ (inputs.target || 'both') != 'server' }}
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          VAULT42_OTP_PROOF_SECRET: ${{ secrets.VAULT42_OTP_PROOF_SECRET }}
          VAULT42_REGISTER_TOKEN: ${{ secrets.VAULT42_REGISTER_TOKEN }}
        run: |
          set -u
          staged="$(mktemp)"
          trap 'rm -f "$staged"' EXIT

          # The three second-factor secrets travel together or not at all. The authority
          # refuses to start when a proof secret is present with no way to deliver a code
          # (config.rs::check_mail_usable), so a PARTIAL set is not a degraded deployment —
          # it is a machine that never boots. Counting them and refusing in between is the
          # difference between a red deploy and a red vault.
          have=0
          for value in "$MAIL_FROM" "$MAIL_PASSWORD" "$VAULT42_OTP_PROOF_SECRET"; do
            if [ -n "$value" ]; then have=$((have + 1)); fi
          done
          case "$have" in
            3)
              printf 'MAIL_FROM=%s\n' "$MAIL_FROM" >>"$staged"
              printf 'MAIL_PASSWORD=%s\n' "$MAIL_PASSWORD" >>"$staged"
              printf 'VAULT42_OTP_PROOF_SECRET=%s\n' "$VAULT42_OTP_PROOF_SECRET" >>"$staged"
              printf 'second factors: ON\n' ;;
            0)
              printf 'second factors: OFF (no mail secrets configured)\n' ;;
            *)
              printf 'refusing: %s of 3 second-factor secrets are set\n' "$have"
              printf 'set all of MAIL_FROM, MAIL_PASSWORD, VAULT42_OTP_PROOF_SECRET, or none\n'
              exit 1 ;;
          esac

          # Optional and independent: an authority with no invite token simply has an open
          # signup, which is a posture rather than a fault. Since the contract is issued to an
          # authenticated account (D13), this gates who may create one — not who may register.
          if [ -n "$VAULT42_REGISTER_TOKEN" ]; then
            printf 'VAULT42_REGISTER_TOKEN=%s\n' "$VAULT42_REGISTER_TOKEN" >>"$staged"
            printf 'signup gate: ON\n'
          else
            printf 'signup gate: OFF (anyone may create an account)\n'
          fi

          if [ ! -s "$staged" ]; then
            printf 'nothing to stage\n'
            exit 0
          fi
          docker run --rm -i -e FLY_API_TOKEN "$FLYCTL" \
            secrets import --stage --app vault42-authority <"$staged"

      - name: deploy vault42-authority
        if: ${{ (inputs.target || 'both') != 'server' }}
        run: |
          docker run --rm -e FLY_API_TOKEN \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/work -w /work "$FLYCTL" \
            deploy --config fly.authority.toml --app vault42-authority \
                   --local-only --ha=false --yes \
                   --image-label "$IMAGE_LABEL" --build-arg "VAULT42_GIT_SHA=$VAULT42_COMMIT"

      # Fetched from the live authority and CHECKED before it is stored. The runbook used to
      # pipe curl straight into `fly secrets set`, so an authority that was briefly unreachable
      # wrote an empty secret — and an empty key used to mean "standalone", which accepts any
      # self-generated keypair with an unlimited quota. The server refuses to boot on an empty
      # value now; this refuses to write one in the first place.
      - name: sync the contract key onto the server
        if: ${{ (inputs.target || 'both') != 'authority' }}
        run: |
          key="$(curl -fsS --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 \
                   "$AUTHORITY_URL/v1/contract-key" | sed 's/.*"public_key":"//;s/".*//')"
          if [ "${#key}" -ne 64 ]; then
            printf 'refusing: the authority returned a %s-char key, not 64\n' "${#key}"
            exit 1
          fi
          case "$key" in
            *[!0-9a-f]*) printf 'refusing: the key is not lowercase hex\n'; exit 1 ;;
          esac
          printf 'VAULT42_CONTRACT_PUBKEY=%s\n' "$key" | docker run --rm -i -e FLY_API_TOKEN \
            "$FLYCTL" secrets import --stage --app vault42-server

      - name: deploy vault42-server
        if: ${{ (inputs.target || 'both') != 'authority' }}
        run: |
          docker run --rm -e FLY_API_TOKEN \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/work -w /work "$FLYCTL" \
            deploy --config fly.toml --app vault42-server \
                   --local-only --ha=false --yes \
                   --image-label "$IMAGE_LABEL"

      # The deploy is not finished until the deployed thing answers. This is the only check in
      # the repo that can see a volume that failed to mount, a secret that never reached the VM,
      # or a fly proxy that stopped speaking h2c to tonic.
      # A server-only deploy leaves the authority as it was, so only a deploy that shipped the
      # authority can demand that it answers as this release.
      - name: smoke the live deployment
        run: |
          if [ "$TARGET" != "server" ]; then
            export EXPECT_VERSION="$VAULT42_VERSION" EXPECT_COMMIT="$VAULT42_COMMIT"
          fi
          sh scripts/smoke/post-deploy.sh

      # Machines wake to serve the smoke test. auto_stop returns them on its own, but only after
      # an idle timeout that bills for minutes nobody used. Stopping them here makes the deploy
      # leave the apps in the state they are meant to sit in: off, costing only their volumes.
      - name: stop the machines again
        if: always()
        run: sh scripts/ops/fly-machines.sh stop
