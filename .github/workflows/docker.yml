# Multi-arch Docker image publish for vault42-server → docker.io/dlesieur/vault42.
#
# Builds deploy/Dockerfile (distroless, glibc) natively per architecture — amd64 on
# ubuntu-24.04, arm64 on ubuntu-24.04-arm — so no Rust compile ever runs under QEMU.
# Each build pushes by digest; a merge job stitches the multi-arch manifest, tags it,
# and cosign-signs the manifest digest (keyless OIDC). Provenance + SBOM are attached
# by buildx.
#
# Tags:  push of vX.Y.Z  → :vX.Y.Z + :latest
#        push to main    → :edge + :sha-<7>
#        workflow_dispatch → as for the ref it runs on
#
# Credentials: the repository secret DOCK_PAT (a Docker Hub access token for the
# `dlesieur` account); the username is not a secret. Actions pinned by commit SHA.
name: docker

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/dlesieur/vault42

jobs:
  build:
    name: build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # WHY THIS EXISTS. On 2026-10-13 and again on 2026-10-14 this workflow went red at the
      # step below with the login action's generic "login failed" text, and nothing in the tree
      # explained it: deploy/Dockerfile and this file were byte-identical to the revision that
      # last published successfully on 2026-09-14. The cause was DOCK_PAT itself, and it took a
      # bisect through five weeks of history to establish that. An expired access token is the
      # single most common way this workflow fails and it is invisible in the diff.
      #
      # So the token is probed BEFORE login-action runs, because the three states a red login can
      # mean — unset, rejected, or the registry unreachable — produce the same message and call
      # for different fixes. This names which one it is. It cannot and does not fix the token:
      # only somebody with write access can rotate it.
      #
      # The probe is a plain curl against the Docker Hub token endpoint rather than a
      # `docker login`, so it tests the credential without writing a docker config.json the job
      # would then have to trust. Only the HTTP status is inspected; the response body is
      # discarded rather than logged, because on some failures that body echoes the token.
      - name: DOCK_PAT must authenticate as dlesieur
        env:
          DOCK_PAT: ${{ secrets.DOCK_PAT }}
        run: |
          set -eu
          if [ -z "${DOCK_PAT:-}" ]; then
            echo "::error::DOCK_PAT is unset. Add a Docker Hub access token for the dlesieur"
            echo "::error::account under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --user "dlesieur:${DOCK_PAT}" \
            'https://auth.docker.io/token?service=registry.docker.io&scope=repository:dlesieur/vault42:pull' \
            || echo 000)
          case "$code" in
            200) printf 'DOCK_PAT authenticates against docker.io\n' ;;
            401|403)
              echo "::error::DOCK_PAT is rejected by Docker Hub (HTTP $code). The token is expired,"
              echo "::error::revoked, or lacks read access to dlesieur/vault42. Rotate it, then"
              echo "::error::re-run this workflow — no code change will clear this."
              exit 1 ;;
            000)
              echo "::error::could not reach auth.docker.io from this runner (network or proxy)."
              echo "::error::This is not a credential problem; re-run before rotating anything."
              exit 1 ;;
            *)
              echo "::error::unexpected HTTP $code from auth.docker.io"
              exit 1 ;;
          esac

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: dlesieur
          password: ${{ secrets.DOCK_PAT }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=vault42-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=vault42-${{ matrix.arch }}
          provenance: true
          sbom: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: manifest + tags + sign
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: dlesieur
          password: ${{ secrets.DOCK_PAT }}

      - name: Resolve tags for this ref
        id: tags
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) tags="${GITHUB_REF_NAME} latest" ;;
            *)            tags="edge sha-${GITHUB_SHA::7}" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "publishing ${IMAGE}: $tags"

      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -eu
          args=""
          for t in ${{ steps.tags.outputs.tags }}; do args="$args -t ${IMAGE}:$t"; done
          # shellcheck disable=SC2046
          docker buildx imagetools create $args $(printf "${IMAGE}@sha256:%s " *)
          first=$(echo ${{ steps.tags.outputs.tags }} | cut -d' ' -f1)
          docker buildx imagetools inspect "${IMAGE}:${first}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${first}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_ENV"

      # imagetools create reads the digests from the registry, so it already fails if an arch
      # never landed — but it is the runner's own authenticated view of a manifest it just wrote,
      # and both the smoke test below and `fly deploy` pull anonymously. A manifest that only
      # resolves for the account that pushed it is published-but-unusable, and nothing here would
      # have said so. This is the only step that checks the image is pullable by someone who
      # cannot write to it, which is exactly how a deploy consumes it.
      #
      # The architecture list is read back off the manifest rather than asserted from the matrix,
      # so a matrix that grows a platform without this list updated still gets checked.
      - name: The published manifest is readable without the push credential
        env:
          # Through env rather than interpolated into the script: a `${{ }}` expression is
          # substituted before the shell ever sees it, so anything an attacker can put in a tag
          # name becomes shell source. The neighbouring manifest step predates that rule and is
          # left alone rather than half-migrated here.
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -eu
          first=$(echo "$TAGS" | cut -d' ' -f1)
          have=$(docker buildx imagetools inspect "${IMAGE}:${first}" \
            --format '{{range .Manifest.Manifests}}{{.Platform.Architecture}}{{"\n"}}{{end}}' | sort -u)
          printf 'manifest %s:%s carries architectures:\n%s\n' "${IMAGE#docker.io/}" "$first" "$have"
          for want in amd64 arm64; do
            if ! printf '%s\n' "$have" | grep -qx "$want"; then
              echo "::error::${IMAGE}:${first} has no ${want} manifest — a published multi-arch"
              echo "::error::tag missing an architecture is worse than no tag, because a deploy"
              echo "::error::that requests it fails at pull time instead of here."
              exit 1
            fi
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the manifest (keyless OIDC)
        run: cosign sign --yes "${IMAGE}@${digest}"

      - name: Smoke-test the pushed image
        run: |
          first=$(echo ${{ steps.tags.outputs.tags }} | cut -d' ' -f1)
          docker run --rm -e VAULT42_DB=/tmp/v.db "${IMAGE}:${first}" --help 2>&1 | head -5 || true
          echo "pushed ${IMAGE}: ${{ steps.tags.outputs.tags }} @ ${digest}" >> "$GITHUB_STEP_SUMMARY"
