# Multi-arch Docker image publish for vault42-server → docker.io/dlesieur/vault42.
#
# Builds deploy/Dockerfile (distroless, glibc) natively per architecture — amd64 on
# ubuntu-24.04, arm64 on ubuntu-24.04-arm — so no Rust compile ever runs under QEMU.
# Each build pushes by digest; a merge job stitches the multi-arch manifest, tags it,
# and cosign-signs the manifest digest (keyless OIDC). Provenance + SBOM are attached
# by buildx.
#
# Tags:  push of vX.Y.Z  → :vX.Y.Z + :latest
#        push to main    → :edge + :sha-<7>
#        workflow_dispatch → as for the ref it runs on
#
# Credentials: the repository secret DOCK_PAT (a Docker Hub access token for the
# `dlesieur` account); the username is not a secret. Actions pinned by commit SHA.
name: docker

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/dlesieur/vault42

jobs:
  build:
    name: build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: dlesieur
          password: ${{ secrets.DOCK_PAT }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=vault42-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=vault42-${{ matrix.arch }}
          provenance: true
          sbom: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: manifest + tags + sign
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: dlesieur
          password: ${{ secrets.DOCK_PAT }}

      - name: Resolve tags for this ref
        id: tags
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) tags="${GITHUB_REF_NAME} latest" ;;
            *)            tags="edge sha-${GITHUB_SHA::7}" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "publishing ${IMAGE}: $tags"

      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -eu
          args=""
          for t in ${{ steps.tags.outputs.tags }}; do args="$args -t ${IMAGE}:$t"; done
          # shellcheck disable=SC2046
          docker buildx imagetools create $args $(printf "${IMAGE}@sha256:%s " *)
          first=$(echo ${{ steps.tags.outputs.tags }} | cut -d' ' -f1)
          docker buildx imagetools inspect "${IMAGE}:${first}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${first}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the manifest (keyless OIDC)
        run: cosign sign --yes "${IMAGE}@${digest}"

      - name: Smoke-test the pushed image
        run: |
          first=$(echo ${{ steps.tags.outputs.tags }} | cut -d' ' -f1)
          docker run --rm -e VAULT42_DB=/tmp/v.db "${IMAGE}:${first}" --help 2>&1 | head -5 || true
          echo "pushed ${IMAGE}: ${{ steps.tags.outputs.tags }} @ ${digest}" >> "$GITHUB_STEP_SUMMARY"
