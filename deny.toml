# cargo-deny — supply-chain policy (run in CI; `make security` locally).
[advisories]
version = 2
yanked = "deny"
# Each entry is an assessed advisory with no available drop-in fix; the comment
# names why it is accepted and the upgrade path that lets us delete the ignore.
# Empty on purpose: the last assessed advisories (russh <0.63, rsa via russh-keys,
# rustls-pemfile via tonic) left the tree when russh 0.65 absorbed russh-keys and
# dropped the RSA feature. A new entry here needs the same treatment as those did:
# name the upgrade path that lets us delete it.
ignore = [
    # bincode 1.3.3 is intentionally frozen (team ceased dev); no successor on 1.x.
    "RUSTSEC-2025-0141",
]

[bans]
multiple-versions = "warn"
# Deny real crates.io wildcard deps, but exempt intra-workspace path deps:
# `{ path = "../vault42-core" }` declares no version, which cargo-deny reads as a
# wildcard. allow-wildcard-paths keeps the ban for external crates only.
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
version = 2
# vault42 is AGPL-3.0; permissive deps are fine. No copyleft-incompatible licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    # CA trust-store data (webpki-roots) — permissive, AGPL-compatible data license.
    "CDLA-Permissive-2.0",
    # The workspace's own crates declare SPDX "AGPL-3.0-only" (not bare "AGPL-3.0").
    "AGPL-3.0-only",
    "CC0-1.0",
    # 0BSD (quoted_printable, via lettre's MIME encoding) is the BSD Zero Clause License:
    # OSI-approved, and strictly more permissive than MIT since it drops the attribution
    # requirement. AGPL-compatible.
    "0BSD",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
